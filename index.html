<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotería Costeña</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  text-align:center;
  color:#333;
}

h1{
  margin:15px;
  font-size:clamp(26px,5vw,44px);
}

/* ===== BOTONES MODERNOS ===== */
.btn{
  background:#d32f2f;
  color:white;
  border:none;
  border-radius:30px;
  padding:12px 22px;
  margin:6px;
  font-size:clamp(14px,3vw,18px);
  cursor:pointer;
  box-shadow:0 6px 12px rgba(0,0,0,.25);
  transition:.25s;
}
.btn:hover{
  background:#b71c1c;
  transform:translateY(-2px);
}

.btn.sec{
  background:#388e3c;
}
.btn.sec:hover{
  background:#1b5e20;
}

.btn.gray{
  background:#455a64;
}
.btn.gray:hover{
  background:#263238;
}

.hidden{display:none}

/* ===== CANTADOR ===== */
.carta-grande{
  max-width:90vw;
  max-height:60vh;
  margin:auto;
}
.carta-grande img{
  width:100%;
  height:auto;
  border-radius:14px;
  border:4px solid #333;
}
h2{
  font-size:clamp(18px,4vw,28px);
}

/* ===== JUGADOR ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  max-width:500px;
  margin:20px auto;
  padding:5px;
}
.cell{
  position:relative;
  border:2px solid #333;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  background:white;
}
.cell img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.cell.marked::after{
  content:"🫘";
  position:absolute;
  font-size:clamp(26px,6vw,42px);
  top:50%;left:50%;
  transform:translate(-50%,-50%);
}

/* ===== MUSICA ===== */
.music-box{
  background:white;
  padding:12px;
  border-radius:14px;
  max-width:420px;
  margin:10px auto;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}
.music-box input{
  width:95%;
  padding:8px;
  border-radius:10px;
  border:1px solid #aaa;
  font-size:14px;
}
</style>
</head>

<body>

<h1> <img src="costa.jpg" alt="Trulli" width="20%" height="20%"> Lotería Costeña / Charro Negro <img src="ayudar.jpg" alt="Trulli" width="20%" height="20%"> </h1>
<button class="btn" onclick="mostrarCantador()">🎤 Cantalas manito</button>
<button class="btn sec" onclick="mostrarJugador()">🟩 Dame una tabla manito</button>


<div id="player"></div>

<!-- CANTADOR -->
<div id="cantador" class="hidden">
  <div class="carta-grande">
    <img id="imgCarta">
  </div>
  <h2 id="nomCarta"></h2>
  <button class="btn gray" onclick="anterior()">⬅ Anterior</button>
  <button class="btn gray" onclick="siguiente()">➡ Siguiente</button><br>
  <button class="btn" onclick="nuevoJuego()">🃏 Nuevo juego</button>
</div>

<!-- JUGADOR -->
<div id="jugador" class="hidden">
  <div class="grid" id="tabla"></div>
  <button class="btn sec" onclick="nuevaTabla()">🔄 Otra tablita esa no me gusto </button>
</div>

<script>
// ===== CARTAS =====
const cartas=[
 {n:"El Gallo",d:"El que le cantó a San Pedro",i:"1.jpg"},
 {n:"El Diablito",d:"Pórtate bien cuatito",i:"2.jpg"},
 {n:"La Dama",d:"Puliendo el paso",i:"3.jpg"},
 {n:"El Catrín",d:"Don Ferruco en la Alameda",i:"4.jpg"},
 {n:"El Paraguas",d:"Para el sol y para el agua",i:"5.jpg"},
 {n:"La Sirena",d:"Medio cuerpo de sirena",i:"6.jpg"},
 {n:"La Escalera",d:"Súbeme paso a pasito",i:"7.jpg"},
 {n:"La Botella",d:"La herramienta del borracho",i:"8.jpg"},
 {n:"El Barril",d:"Tanto tomo que se me acabó",i:"9.jpg"},
 {n:"El Árbol",d:"El que a buen árbol se arrima",i:"10.jpg"},
 {n:"El Melón",d:"Me lo cortas o me lo dejas",i:"11.jpg"},
 {n:"El Valiente",d:"¿Por qué le corres cobarde?",i:"12.jpg"},
 {n:"El Gorrito",d:"Ponle su gorrito al nene",i:"13.jpg"},
 {n:"La Muerte",d:"La muerte tilica y flaca",i:"14.jpg"},
 {n:"La Pera",d:"El que espera desespera",i:"15.jpg"},
 {n:"El Corazón",d:"No me extrañes corazón",i:"16.jpg"}
];

let juego=[...cartas], idx=0;
const barajar=new Audio("https://www.soundjay.com/misc/sounds/shuffling-cards-1.mp3");

// ===== VOZ =====
function hablar(t){
 const u=new SpeechSynthesisUtterance(t);
 u.lang="es-MX";u.rate=0.85;
 speechSynthesis.speak(u);
}

// ===== VISTAS =====
function mostrarCantador(){
 cantador.classList.remove("hidden");
 jugador.classList.add("hidden");
 mostrarCarta();
}
function mostrarJugador(){
 jugador.classList.remove("hidden");
 cantador.classList.add("hidden");
 nuevaTabla();
}

// ===== CANTADOR =====
function mostrarCarta(){
 const c=juego[idx];
 imgCarta.src=c.i;
 nomCarta.innerText=c.n;
 hablar(c.n+", "+c.d);
}
function siguiente(){if(idx<juego.length-1){idx++;mostrarCarta();}}
function anterior(){if(idx>0){idx--;mostrarCarta();}}
function nuevoJuego(){
 barajar.play();
 juego=[...cartas].sort(()=>Math.random()-0.5);
 idx=0;
 setTimeout(mostrarCarta,800);
}


// ===== JUGADOR =====
function nuevaTabla(){
  tabla.innerHTML = "";

  [...cartas].sort(() => Math.random() - 0.5).slice(0,16).forEach(c => {
    const d = document.createElement("div");
    d.className = "cell";

    const img = document.createElement("img");
    img.src = c.i;      
    img.alt = c.n;

    d.appendChild(img);
    d.onclick = () => marcar(d);

    tabla.appendChild(d);
  });
}

function marcar(c){
 c.classList.toggle("marked");
 if(document.querySelectorAll(".marked").length===16){
  hablar("¡Loteriiiiiaaaaa manitooooooooo ganeeeeeeee!");
  alert("¡LOTERÍA!");
 }
}


</script>

</body>
</html>
