<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotería Costeña</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  text-align:center;
  color:#333;
}

h1{
  margin:15px;
  font-size:clamp(26px,5vw,44px);
}

/* ===== BOTONES MODERNOS ===== */
.btn{
  background:#d32f2f;
  color:white;
  border:none;
  border-radius:30px;
  padding:12px 22px;
  margin:6px;
  font-size:clamp(14px,3vw,18px);
  cursor:pointer;
  box-shadow:0 6px 12px rgba(0,0,0,.25);
  transition:.25s;
}
.btn:hover{
  background:#b71c1c;
  transform:translateY(-2px);
}

.btn.sec{
  background:#388e3c;
}
.btn.sec:hover{
  background:#1b5e20;
}

.btn.gray{
  background:#455a64;
}
.btn.gray:hover{
  background:#263238;
}

.hidden{display:none}

/* ===== CANTADOR ===== */
.carta-grande{
  max-width:90vw;
  max-height:60vh;
  margin:auto;
}
.carta-grande img{
  width:100%;
  height:auto;
  border-radius:14px;
  border:4px solid #333;
}
h2{
  font-size:clamp(18px,4vw,28px);
}

/* ===== JUGADOR ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  max-width:500px;
  margin:20px auto;
  padding:5px;
}
.cell{
  position:relative;
  border:2px solid #333;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  background:white;
}
.cell img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.cell.marked::after{
  content:"🫘";
  position:absolute;
  font-size:clamp(26px,6vw,42px);
  top:50%;left:50%;
  transform:translate(-50%,-50%);
}
</style>
</head>

<body>

<h1>
  <img src="costa.jpg" width="15%"> 
  Lotería Costeña
  <img src="ayudar.jpg" width="15%">
</h1>

<button class="btn" onclick="mostrarCantador()">🎤 Cantalas manito</button>
<button class="btn sec" onclick="mostrarJugador()">🟩 Dame una tabla manito</button>

<!-- CANTADOR -->
<div id="cantador" class="hidden">
  <div class="carta-grande">
    <img id="imgCarta">
  </div>
  <h2 id="nomCarta"></h2>
  <button class="btn gray" onclick="anterior()">⬅ Anterior</button>
  <button class="btn gray" onclick="siguiente()">➡ Siguiente</button><br>
  <button class="btn" onclick="nuevoJuego()">🃏 Nuevo juego</button>
</div>

<!-- JUGADOR -->
<div id="jugador" class="hidden">
  <div class="grid" id="tabla"></div>
  <button class="btn sec" onclick="nuevaTabla()">🔄 Otra tablita esa no me gusto</button>
</div>

<footer>
  <p>© 2026 Charro Negro</p>
</footer>

<script>
// ===== CARTAS =====
const cartas=[
 {n:"La costa",d:"La costa no tiene dueño, pero sí quien la presuma con sal y coco",i:"1.jpg"},
 {n:"La maca",d:"Maca calladita, cuando pega nadie se quita",i:"2.jpg"},
 {n:"La chicatana",d:"Chicatana de temporada, negrita tostada y bien deseada",i:"3.jpg"},
 {n:"Las canasteras",d:"Canasteras van cantando, tamales van anunciando",i:"4.jpg"},
 {n:"La bici",d:"Bici vieja pero fiel, te lleva y no pregunta a dónde es",i:"5.jpg"},
 {n:"Los bolis",d:"Bolis fríos del calor, infancia guardada en sabor",i:"6.jpg"},
 {n:"El tlacuache",d:"Tlacuache panza llena, se hace el muerto y no se apena",i:"7.jpg"},
 {n:"La chicalmaca",d:"Chicalmaca bien picosa, si no lloras no es sabrosa",i:"8.jpg"},
 {n:"El moto taxi",d:"Moto taxi acelerado, chisme corto y recado entregado",i:"9.jpg"},
 {n:"El zancudo",d:"Zancudo bravo de estero, pica duro y vuela ligero",i:"10.jpg"},
 {n:"La panga",d:"La panga va despacito, pero vuelve con pescadito",i:"11.jpg"},
 {n:"Pan con capricho",d:"Pan con capricho quiere beso y cafecito",i:"12.jpg"},
 {n:"La culebra",d:"Culebra que se atraviesa, respeto pide y reza",i:"13.jpg"},
 {n:"Los diablos",d:"Cuando bailan los diablos, retumba el suelo y el fandango, uuuuuuuuuuuh uuuuuuuuuuh",i:"14.jpg"},
 {n:"Los biuces",d:"Biuces bien pintados, más listos que los callados",i:"15.jpg"},
  {n:"El corozo",d:"Corozo pa’l calor, refresca cuerpo y corazón",i:"16.jpg"},
  {n:"El molote",d:"Molote bien relleno, quita el hambre y da consuelo",i:"17.jpg"},
  {n:"La hierba santa",d:"Hierba santa perfumada, bendición en cada guisada",i:"18.jpg"},
  {n:"El metate",d:"Metate viejo y paciente, sabor fuerte desde siempre",i:"19.jpg"},
  {n:"El cusuco",d:"Cusuco bien escondido, manjar fino si es cocido",i:"20.jpg"},
  {n:"El chacalín",d:"Chacalín chiquitín, pero sabroso hasta el fin",i:"21.jpg"},
  {n:"Flor de Todos Santos",d:"Flor que llama a los que se fueron, con aroma a recuerdo bueno",i:"22.jpg"},
  {n:"El jaripeo",d:"Jaripeo sin gritos no levanta polvaredo",i:"23.jpg"},
  {n:"El guaje",d:"Guaje tierno o secadito, acompaña todo platillo",i:"24.jpg"},
  {n:"El cuije",d:"Cuije que corre y se pierde, del susto nadie se acuerde",i:"25.jpg"},
  {n:"El machete",d:"Machete bien afilado, respeto bien ganado",i:"26.jpg"},
  {n:"El pan de pico",d:"Pan de pico crujiente, bueno con café o aguardiente",i:"27.jpg"},
  {n:"El pan de yema",d:"Pan de yema calientito, abrazo directo al pecho bendito",i:"28.jpg"},
  {n:"Los muchitos",d:"Muchitos brincadores, risas, tierra y sudores",i:"29.jpg"},
  {n:"El endoco",d:"Endoco en mole, en caldo es sabrosoooo",i:"30.jpg"},
  {n:"La regañada",d:"Regañada que no educa, pero sí deja recuerdo duro",i:"31.jpg"},
  {n:"El bule",d:"Bule con agua fresca, alivio que nunca pesa",i:"32.jpg"},
  {n:"El Zanate",d:"Zanate gritón y negro, anuncia sol desde temprano",i:"33.jpg"},
  {n:"La iguana",d:"Iguana tomando el sol, paciencia hecha animal",i:"34.jpg"},
  {n:"La chilena",d:"Chilena bien zapateada, la costa queda enamorada",i:"35.jpg"},
  {n:"La empanochada",d:"Empanochada doradita, dulce pecado bendito",i:"36.jpg"},
  {n:"La chuparrosa",d:"Chuparrosa ligera, besa flores sin espera",i:"37.jpg"},
  {n:"El popoyote",d:"Popoyote revoltoso, se mueve rápido y chismoso",i:"38.jpg"},
  {n:"Las picaditas",d:"Picaditas con salsita, poquito basta pa’ la cita",i:"39.jpg"},
  {n:"La tichanda",d:"Tichanda bien dorada, truena rico en la lumbre alzada",i:"40.jpg"},
  {n:"El cuche",d:"Cuche gordo y consentido, futuro plato bien servido",i:"41.jpg"},
  {n:"El queso de prensa",d:"Queso de prensa salado, con tortilla va casado",i:"42.jpg"},
  {n:"El sapo",d:"Sapo quieto en el charco, feo pero bien bragado",i:"43.jpg"},
  {n:"El charpe",d:"Charpe cerquita del río, mojarse quita el frío",i:"44.jpg"},
  {n:"El tamal de chipil",d:"Tamal de chipil sabroso, verde tierno y generoso",i:"45.jpg"},
  {n:"El guacho",d:"Guacho llega sin aviso, pero siempre pide piso",i:"46.jpg"},
  {n:"El tamal de chileajo",d:"Tamal de chileajo bravo, sabor que manda y no pide permiso",i:"47.jpg"},
  {n:"La concha",d:"Pa descansar agustooooooo",i:"48.jpg"},
  {n:"El guamúchil",d:"Guamúchil agridulcito, antojo del arbolito",i:"49.jpg"},
  {n:"La tarraya",d:"Tarraya que vuela al mar, promesa lista pa’ pescar",i:"50.jpg"},
  {n:"La tortolita",d:"Tortolita canta quedo, mensajera del silencio",i:"51.jpg"},
  {n:"La Virgen de Juquila",d:"Juquila milagrosa, fe que camina",i:"52.jpg"},
  {n:"La tarecua",d:"Tarecua bien fría, espanta penas todavía",i:"53.jpg"},
 {n:"El icaco",d:"Icaco blanco o morado, sabor costeño guardado",i:"54.jpg"}
];

let juego=[...cartas], idx=0;
let combinacionesUsadas = new Set();

const barajar=new Audio("https://www.soundjay.com/misc/sounds/shuffling-cards-1.mp3");

// ===== VOZ =====
function hablar(t){
 const u=new SpeechSynthesisUtterance(t);
 u.lang="es-MX";u.rate=0.85;
 speechSynthesis.speak(u);
}

// ===== VISTAS =====
function mostrarCantador(){
 cantador.classList.remove("hidden");
 jugador.classList.add("hidden");
 mostrarCarta();
}
function mostrarJugador(){
 jugador.classList.remove("hidden");
 cantador.classList.add("hidden");
 nuevaTabla();
}

// ===== CANTADOR =====
function mostrarCarta(){
 const c=juego[idx];
 imgCarta.src=c.i;
 nomCarta.innerText=c.n;
 hablar(c.n+", "+c.d);
}
function siguiente(){if(idx<juego.length-1){idx++;mostrarCarta();}}
function anterior(){if(idx>0){idx--;mostrarCarta();}}
function nuevoJuego(){
 combinacionesUsadas.clear();
 barajar.play();
 juego=[...cartas].sort(()=>Math.random()-0.5);
 idx=0;
 setTimeout(mostrarCarta,800);
}

// ===== JUGADOR (SIN REPETIR TABLITAS) =====
function nuevaTabla(){
  tabla.innerHTML="";

  let combo;
  do{
    combo=[...cartas]
      .sort(()=>Math.random()-0.5)
      .slice(0,16)
      .map(c=>c.i)
      .join(",");
  }while(combinacionesUsadas.has(combo));

  combinacionesUsadas.add(combo);

  combo.split(",").forEach(imgSrc=>{
    const c=cartas.find(x=>x.i===imgSrc);
    const d=document.createElement("div");
    d.className="cell";
    const img=document.createElement("img");
    img.src=c.i;
    img.alt=c.n;
    d.appendChild(img);
    d.onclick=()=>marcar(d);
    tabla.appendChild(d);
  });
}

function marcar(c){
 c.classList.toggle("marked");
 if(document.querySelectorAll(".marked").length===16){
  hablar("¡Loteriiiiiaaaaa manitoooo ganeeee!");
  alert("¡LOTERÍA!");
 }
}
</script>

</body>
</html>
